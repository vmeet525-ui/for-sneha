<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Surprise for Sneha ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; }
    .screen { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; background-size: cover; background-position: center; background-repeat: no-repeat; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .active { display: flex; }

    /* Screen 1 */
    #screen1 { background-image: url('IMG_7641.jpeg'); cursor: pointer; }
    .paper-note { background: #fffef0; padding: 20px 30px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transform: rotate(-3deg); border: 1px solid #e2d9c2; }
    .paper-note h1 { color: #333; font-size: 2rem; font-weight: bold; }
    .paper-note p { color: #777; font-size: 0.85rem; margin-top: 6px; }

    /* Screen 2 */
    #screen2 { background: radial-gradient(circle, #ffb6c1, #ff69b4, #db7093); position: relative; }
    .sunflower { position: absolute; font-size: 2.2rem; user-select: none; }
    .card-pink { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 20px; padding: 25px; max-width: 90%; box-shadow: 0 0 25px rgba(255, 105, 180, 0.8); border: 2px solid rgba(255, 255, 255, 0.6); color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); z-index: 10; }
    .card-pink p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px; }
    .btn { background: #ffffff; color: #ff1493; border: none; padding: 12px 28px; font-size: 1rem; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

    /* Screen 3 */
    #screen3 { background: radial-gradient(circle, #ffb6c1, #ff69b4, #db7093); }
    .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 15px; }
    .btn-yes { background: #28a745; color: white; }
    .btn-no { background: #dc3545; color: white; }

    /* Screen 4 & 5 */
    #screen4, #screen5 { background-image: url('IMG_7640.jpeg'); }
    .overlay-card { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 25px; border-radius: 15px; color: white; max-width: 90%; border: 1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <!-- Screen 1 -->
  <div id="screen1" class="screen active" onclick="nextScreen(2)">
    <div class="paper-note">
      <h1>Hey Sneha ✨</h1>
      <p>(Tap anywhere to open)</p>
    </div>
  </div>

  <!-- Screen 2 -->
  <div id="screen2" class="screen">
    <span class="sunflower" style="top: 8%; left: 8%;">🌻</span>
    <span class="sunflower" style="top: 12%; right: 10%;">🌻</span>
    <span class="sunflower" style="bottom: 10%; left: 10%;">🌻</span>
    <span class="sunflower" style="bottom: 8%; right: 8%;">🌻</span>

    <div class="card-pink">
      <p>
        Every moment spent with you is special, and I just wanted to create a tiny little space on the web dedicated to making you smile today.
      </p>
      <button class="btn" onclick="nextScreen(3)">Continue</button>
    </div>
  </div>

  <!-- Screen 3 -->
  <div id="screen3" class="screen">
    <div class="card-pink">
      <h2 style="margin-bottom: 15px; font-size: 1.5rem;">Can we go on a non-date? ☕✨</h2>
      <div class="btn-group">
        <button class="btn btn-yes" onclick="nextScreen(4)">Yes!</button>
        <button class="btn btn-no" onclick="nextScreen(5)">No</button>
      </div>
    </div>
  </div>

  <!-- Screen 4 (Yes) -->
  <div id="screen4" class="screen">
    <div class="overlay-card">
      <h1 style="font-size: 2rem; margin-bottom: 10px;">Thank You So Much! ❤️</h1>
      <p style="font-size: 1.1rem;">I can't wait! Let's plan it soon. 😊</p>
    </div>
  </div>

  <!-- Screen 5 (No) -->
  <div id="screen5" class="screen">
    <div class="overlay-card">
      <h2 style="margin-bottom: 15px;">Please think again? 🥺</h2>
      <div class="btn-group">
        <button class="btn btn-yes" onclick="nextScreen(4)">Yes!</button>
        <button class="btn btn-yes" onclick="nextScreen(4)">Yes!</button>
      </div>
    </div>
  </div>

  <script>
    function nextScreen(screenNum) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen' + screenNum).classList.add('active');
    }
  </script>
</body>
</html>
